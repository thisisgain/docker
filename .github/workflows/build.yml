name: Build Docker Images

on:
  push:
    branches:
      - main
    paths:
      - '**/version.txt'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build'
        required: true
        type: choice
        options:
          # Add new image directories here when created
          - php
          - php/dev
          - toolbox

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      base-matrix: ${{ steps.set-matrix.outputs.base-matrix }}
      dependent-matrix: ${{ steps.set-matrix.outputs.dependent-matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed images
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=$(echo '${{ inputs.service }}' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD \
              | grep 'version.txt' \
              | sed 's|/version.txt||' \
              | sort | uniq \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          # Dependent images build on top of a base image in this repo, so they
          # must build only after their base has been pushed. "php/dev" depends
          # on "php". Split the changed services into two groups.
          BASE=$(echo "$CHANGED" | jq -c 'map(select(. != "php/dev"))')
          DEPENDENT=$(echo "$CHANGED" | jq -c 'map(select(. == "php/dev"))')
          echo "base-matrix={\"service\":$BASE}" >> $GITHUB_OUTPUT
          echo "dependent-matrix={\"service\":$DEPENDENT}" >> $GITHUB_OUTPUT

  # Base images first (everything except php/dev).
  build-base:
    needs: detect-changes
    uses: ./.github/workflows/build-image.yml
    with:
      matrix: ${{ needs.detect-changes.outputs.base-matrix }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Dependent images (php/dev) after the base has been pushed. Still runs when
  # only php/dev changed (build-base skips), but not if build-base failed.
  build-dependent:
    needs: [detect-changes, build-base]
    if: ${{ always() && needs.build-base.result != 'failure' }}
    uses: ./.github/workflows/build-image.yml
    with:
      matrix: ${{ needs.detect-changes.outputs.dependent-matrix }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
