name: Build Docker Images

on:
  push:
    branches:
      - main
    paths:
      - '**/version.txt'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build'
        required: true
        type: choice
        options:
          # Add new image directories here when created
          - php
          - php/dev
          - toolbox

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect changed images
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED=$(echo '${{ inputs.service }}' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD \
              | grep 'version.txt' \
              | sed 's|/version.txt||' \
              | sort | uniq \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "matrix={\"service\":$CHANGED}" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Get version
        id: get-version
        run: |
          VERSION=$(sed -n '1p' ${{ matrix.service }}/version.txt | tr -d '[:space:]')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # Derive image name: use last path segment (e.g. php/dev -> php-dev, php -> php)
          IMAGE=$(echo "${{ matrix.service }}" | tr '/' '-')
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          # Tag as latest only if second line of version.txt is 'latest'
          if [ "$(sed -n '2p' ${{ matrix.service }}/version.txt | tr -d '[:space:]')" = "latest" ]; then
            echo "TAGS=thisisgain/$IMAGE:latest,thisisgain/$IMAGE:$VERSION" >> $GITHUB_OUTPUT
          else
            echo "TAGS=thisisgain/$IMAGE:$VERSION" >> $GITHUB_OUTPUT
          fi

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ steps.get-version.outputs.VERSION }}
          tags: ${{ steps.get-version.outputs.TAGS }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        if: hashFiles(format('{0}/README.md', matrix.service)) != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: thisisgain/${{ steps.get-version.outputs.IMAGE }}
          readme-filepath: ./${{ matrix.service }}/README.md
