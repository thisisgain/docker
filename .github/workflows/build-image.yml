name: Build Image (reusable)

# Reusable workflow that builds and pushes a single matrix of images.
# Called once per "tier" by build.yml so that dependent images (e.g. php/dev)
# only start after their base image (php) has been pushed.
#
# Each architecture is built on its OWN native runner (amd64 on ubuntu-latest,
# arm64 on ubuntu-24.04-arm) to avoid slow QEMU emulation. The per-arch images
# are pushed by digest, then a merge job stitches them into one multi-arch
# manifest under the real tags.

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON matrix object, e.g. {"service":["php"]}'
        required: true
        type: string
    secrets:
      # Needs full Read/Write/Delete scope: the "update description" API rejects
      # push-only tokens with a 403.
      DOCKERHUB_TOKEN:
        required: true

env:
  REGISTRY_IMAGE_PREFIX: thisisgain

jobs:
  # Build one architecture of one service natively, push by digest only.
  build:
    if: ${{ fromJson(inputs.matrix).service[0] != null }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.matrix).service }}
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Get build config
        id: cfg
        run: |
          VERSION=$(sed -n '1p' ${{ matrix.service }}/version.txt | tr -d '[:space:]')
          # Derive image name: use last path segment (e.g. php/dev -> php-dev, php -> php)
          IMAGE=$(echo "${{ matrix.service }}" | tr '/' '-')
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          # PHP_VERSION is the base tag to build FROM. For a dependent image
          # (e.g. php/dev) that is the parent dir's version (php/version.txt).
          # For a top-level image the parent has no version.txt, so fall back to
          # this image's own version.
          BASE_DIR=$(dirname "${{ matrix.service }}")
          if [ -f "$BASE_DIR/version.txt" ]; then
            BASE_VERSION=$(sed -n '1p' "$BASE_DIR/version.txt" | tr -d '[:space:]')
          else
            BASE_VERSION="$VERSION"
          fi
          echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
          # Sanitized platform string for artifact naming (linux/amd64 -> linux-amd64)
          echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: ${{ matrix.platform }}
          build-args: |
            PHP_VERSION=${{ steps.cfg.outputs.BASE_VERSION }}
          # Push by digest only; the merge job assigns the real tags.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE_PREFIX }}/${{ steps.cfg.outputs.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Disable provenance/SBOM attestations. They add an "unknown/unknown"
          # entry to the pushed digests, which corrupts the merged manifest
          # (stray platform + a missing real arch). We only want the image.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.cfg.outputs.IMAGE }}-${{ steps.cfg.outputs.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine per-arch digests into one multi-arch manifest under the real tags.
  merge:
    needs: build
    if: ${{ fromJson(inputs.matrix).service[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.matrix).service }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Get tags
        id: cfg
        run: |
          VERSION=$(sed -n '1p' ${{ matrix.service }}/version.txt | tr -d '[:space:]')
          IMAGE=$(echo "${{ matrix.service }}" | tr '/' '-')
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # Tag as latest only if second line of version.txt is 'latest'
          if [ "$(sed -n '2p' ${{ matrix.service }}/version.txt | tr -d '[:space:]')" = "latest" ]; then
            echo "TAGS=thisisgain/$IMAGE:latest,thisisgain/$IMAGE:$VERSION" >> $GITHUB_OUTPUT
          else
            echo "TAGS=thisisgain/$IMAGE:$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          # Anchor to the per-platform suffix so e.g. the "php" merge cannot
          # accidentally match "php-dev" digests (digests-php-* would otherwise
          # also match digests-php-dev-*).
          pattern: digests-${{ steps.cfg.outputs.IMAGE }}-linux-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # We build exactly two architectures (amd64 + arm64). If we don't have
          # two digests here, the manifest would be incomplete (e.g. a missing
          # arch), so fail loudly instead of pushing a broken single-arch image.
          COUNT=$(ls -1 | wc -l | tr -d '[:space:]')
          echo "Found $COUNT digest(s):"; ls -1
          if [ "$COUNT" -ne 2 ]; then
            echo "::error::Expected 2 arch digests (amd64+arm64) but found $COUNT. Refusing to push an incomplete manifest."
            exit 1
          fi
          # Build a -t flag per tag, then reference each arch by digest.
          TAG_FLAGS=$(echo "${{ steps.cfg.outputs.TAGS }}" | tr ',' '\n' | sed 's/^/-t /' | tr '\n' ' ')
          docker buildx imagetools create $TAG_FLAGS \
            $(printf 'thisisgain/${{ steps.cfg.outputs.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect thisisgain/${{ steps.cfg.outputs.IMAGE }}:${{ steps.cfg.outputs.VERSION }}

      # Cosmetic README sync. Never fail the job over it: the image is already
      # built and pushed by this point.
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        if: hashFiles(format('{0}/README.md', matrix.service)) != ''
        continue-on-error: true
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: thisisgain/${{ steps.cfg.outputs.IMAGE }}
          readme-filepath: ./${{ matrix.service }}/README.md
